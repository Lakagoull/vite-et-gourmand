; Réglages PHP de production
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
upload_max_filesize = 4M
post_max_size = 24M
max_file_uploads = 10
memory_limit = 256M
date.timezone = Europe/Paris
session.cookie_httponly = 1
session.use_strict_mode = 1
variables_order = "EGPCS"
